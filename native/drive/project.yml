name: EmberDrive
options:
  bundleIdPrefix: com.local.meetingnotes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9785XZK34L
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
packages:
  DriveCore:
    path: DriveCore
targets:
  EmberDrive:
    type: application
    platform: macOS
    sources:
      - path: Agent
        excludes: ["*.entitlements"]
    dependencies:
      - package: DriveCore
        product: DriveCore
      - target: EmberDriveFS
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Extensions
    info:
      path: Agent/Info.plist
      properties:
        CFBundleName: Ember Drive
        CFBundleDisplayName: Ember Drive
        CFBundleExecutable: Ember Drive
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSServices:
          - NSMenuItem: {default: "Copy Ember Drive Share Link"}
            NSMessage: copyShareLink
            NSPortName: Ember Drive
            NSSendFileTypes: [public.item]
          - NSMenuItem: {default: "Share with Ember"}
            NSMessage: shareWithEmber
            NSPortName: Ember Drive
            NSSendFileTypes: [public.movie]
          - NSMenuItem: {default: "Keep on This Mac (Ember Drive)"}
            NSMessage: keepOffline
            NSPortName: Ember Drive
            NSSendFileTypes: [public.item]
          - NSMenuItem: {default: "Remove Offline Copy (Ember Drive)"}
            NSMessage: removeOffline
            NSPortName: Ember Drive
            NSSendFileTypes: [public.item]
    settings:
      base:
        PRODUCT_NAME: Ember Drive
        PRODUCT_BUNDLE_IDENTIFIER: com.local.meetingnotes.drive
        CODE_SIGN_ENTITLEMENTS: Agent/Agent.entitlements
  EmberDriveFS:
    type: app-extension
    platform: macOS
    sources:
      - path: DriveFS
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: DriveCore
        product: DriveCore
    settings:
      base:
        PRODUCT_NAME: EmberDriveFS
        PRODUCT_BUNDLE_IDENTIFIER: com.local.meetingnotes.drive.fs
        INFOPLIST_FILE: DriveFS/Info.plist
        CODE_SIGN_ENTITLEMENTS: DriveFS/DriveFS.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
