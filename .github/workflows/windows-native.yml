name: Windows native helpers
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Windows acceptance scope
        type: choice
        default: full
        options: [full, credentials, save-dialog, packaged-save]
  push:
    branches: ['main', 'codex/windows-port']
    paths: ['native/windows/**', 'src/**', 'renderer/**', 'test/**', 'scripts/*windows*', 'scripts/patch-word-extractor.js', 'package*.json', 'native/parakeet-worker/**', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['native/windows/**', 'src/**', 'renderer/**', 'test/**', 'scripts/*windows*', 'scripts/patch-word-extractor.js', 'package*.json', 'native/parakeet-worker/**', '.github/workflows/windows-native.yml']
concurrency:
  group: windows-port-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  save-dialog:
    if: ${{ inputs.scope == 'save-dialog' }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify owned native Save dialog cancellation and filename entry
        run: node scripts/test-windows-save-dialog.js
  packaged-save:
    if: ${{ inputs.scope == 'packaged-save' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned renderer dependencies for export model verification
        working-directory: renderer
        run: bun install --frozen-lockfile
      - name: Verify accepted package production sources match this candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $producer = gh api repos/${{ github.repository }}/actions/runs/37581959855 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $producer.conclusion -ne 'success') { throw 'The accepted package run is not successful.' }
          $producerSha = $producer.head_sha
          if ($producerSha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid accepted package commit.' }
          git fetch --depth=1 origin $producerSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only $producerSha HEAD -- src renderer native package.json package-lock.json assets resources build 'scripts/build-*' 'scripts/provision-*' 'scripts/patch-*' 'electron-builder*')
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 0) { throw ('Accepted package production sources differ: ' + ($changed -join ', ')) }
          Write-Output "Verified accepted package production source: $producerSha"
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-installers-x64
          run-id: 37581959855
          github-token: ${{ github.token }}
          path: dist/
      - name: Extract the accepted Windows portable application
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one accepted Windows portable archive.' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath dist/win-unpacked
          if (!(Test-Path -LiteralPath dist/win-unpacked/Ember.exe)) { throw 'Accepted Windows executable is missing.' }
      - name: Verify actual packaged native Save MP4 and GIF exports
        run: node scripts/test-windows-app-startup.js
      - name: Verify actual installed native Save MP4 and GIF exports
        if: ${{ !cancelled() }}
        run: node scripts/test-windows-installer.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ember-windows-packaged-save-evidence
          path: |
            dist/windows-startup-evidence/
            dist/windows-installed-startup-evidence/
  hotkey:
    if: ${{ inputs.scope != 'credentials' && inputs.scope != 'save-dialog' && inputs.scope != 'packaged-save' }}
    outputs:
      native-artifacts: ${{ steps.native_artifacts.conclusion }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run setup:windows-media
      - run: npm run setup:windows-ai
      - run: npm run setup:windows-whisper
      - name: Verify Windows local AI runtime launches
        run: ./native/windows/bin/llama/llama-server.exe --version
      - run: npm run build:renderer
        id: renderer
      - name: Verify offline Windows image text recognition
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-ocr.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify official Windows Notion CLI launches
        run: node scripts/test-windows-notion.js
      - name: Unit and media conversion tests
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Chromium recording lifecycle with generated devices
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          $env:EMBER_CAPTURE_RESULT = Join-Path $env:RUNNER_TEMP 'ember-capture-result.json'
          Remove-Item $env:EMBER_CAPTURE_RESULT -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-capture-renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_CAPTURE_RESULT | ConvertFrom-Json
          if ($result.rendererCapture -ne 'passed' -or $result.audioSamples -lt 16000) { throw 'Missing capture acceptance evidence' }
      - name: Record real Windows window and desktop area pixels
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          $env:EMBER_DESKTOP_CAPTURE_RESULT = Join-Path $env:RUNNER_TEMP 'ember-desktop-capture-result.json'
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-desktop-capture.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_DESKTOP_CAPTURE_RESULT | ConvertFrom-Json
          if ($result.windowsDesktopCapture -ne 'passed' -or !$result.realDesktopPixels -or !$result.movingWindowFrames -or !$result.occludedWindowFrames -or $result.captured.Count -ne 3) { throw 'Missing real desktop/window recording evidence' }
      - name: Chromium export compositor pixel checks
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:EMBER_EXPORT_RESULT = Join-Path $env:RUNNER_TEMP 'ember-export-result.json'
          Remove-Item $env:EMBER_EXPORT_RESULT -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-export-compositor.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_EXPORT_RESULT | ConvertFrom-Json
          if ($result.exportCompositor -ne 'passed' -or $result.pixelChecks -lt 13) { throw 'Missing compositor pixel evidence' }
      - name: Complete Chromium MP4 and GIF export lifecycle
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          $env:FFPROBE_BIN = (Resolve-Path 'native/windows/bin/ffprobe.exe').Path
          $env:EMBER_EXPORT_MEDIA_RESULT = Join-Path $env:RUNNER_TEMP 'ember-export-media-result.json'
          Remove-Item $env:EMBER_EXPORT_MEDIA_RESULT -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-export.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_EXPORT_MEDIA_RESULT | ConvertFrom-Json
          if ($result.windowsExport -ne 'passed' -or $result.cancellation -ne 'passed' -or $result.frameComparison.frames -ne 18) { throw 'Missing export lifecycle evidence' }
      - uses: actions/setup-dotnet@v4
        if: ${{ !cancelled() }}
        with:
          dotnet-version: '10.0.x'
      - run: node scripts/build-windows-native.js x64
        id: native
        if: ${{ !cancelled() }}
      - name: Verify DPAPI encrypted Windows Drive state
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-drive-state.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Cloud Files placeholder hydration and ownership
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        run: node scripts/test-windows-cloud-files.js
      - name: Verify Windows PDF Word HTML and RTF document reading
        run: node scripts/test-windows-documents.js
      - name: Verify helper startup and request protocol
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = (Resolve-Path 'native/windows/bin/meeting-notes-hotkey.exe').Path
          $info.UseShellExecute = $false
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($info)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"cmd":"status","id":42}')
          $process.StandardInput.WriteLine('{"cmd":"browserUrl","process":"ember-ci-not-a-browser","id":43}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(15000)) { $process.Kill(); throw 'Helper did not exit after stdin closed' }
          if ($process.ExitCode -ne 0) { throw $errors.Result }
          $messages = $output.Result -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json }
          $reply = $messages | Where-Object { $_.id -eq 42 }
          if (!$reply -or !$reply.tap) { throw 'Missing keyboard hook status reply' }
          $browser = $messages | Where-Object { $_.id -eq 43 }
          if (!$browser -or $null -ne $browser.url -or $browser.ok -eq $false) { throw 'Browser URL request must reject an unrecognized foreground app' }
      - name: Verify Windows Chromium focus copy paste and password protection
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-input.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Save dialog automation before package acceptance
        run: node scripts/test-windows-save-dialog.js
      - name: Verify foreground Edge URL and background rejection
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows audio-session observer startup
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          $output = & ./native/windows/bin/meeting-notes-hotkey.exe audio-apps
          if ($LASTEXITCODE -ne 0) { throw 'Windows audio session enumeration failed' }
          $result = $output | ConvertFrom-Json
          if ($result.type -ne 'audio-apps' -or $null -eq $result.apps) { throw 'Missing audio session snapshot' }
      - name: Verify native Windows area picker input and capture
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          $image = Join-Path $env:RUNNER_TEMP 'ember-area-capture.png'
          $output = & ./native/windows/bin/meeting-notes-hotkey.exe capture-test --out $image
          if ($LASTEXITCODE -ne 0) { throw 'Native area capture failed' }
          $result = $output | ConvertFrom-Json
          if (!$result.selfTest -or $result.cancelled -or $result.width -ne 200 -or $result.height -ne 120 -or !(Test-Path $image)) { throw 'Missing native input/pixel capture evidence' }
          $windowImage = Join-Path $env:RUNNER_TEMP 'ember-window-capture.png'
          $window = & ./native/windows/bin/meeting-notes-hotkey.exe capture-window-test --out $windowImage | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$window.selfTest -or $window.cancelled -or $window.width -ne 400 -or $window.height -ne 300) { throw 'Window picker Space/input/pixel check failed' }
          $cancelImage = Join-Path $env:RUNNER_TEMP 'ember-cancelled-capture.png'
          $cancel = & ./native/windows/bin/meeting-notes-hotkey.exe capture-cancel-test --out $cancelImage | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$cancel.cancelled -or (Test-Path $cancelImage)) { throw 'Escape did not cancel without creating a screenshot' }

      - uses: actions/upload-artifact@v4
        id: native_artifacts
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin/
  transcription-worker:
    if: ${{ inputs.scope != 'credentials' && inputs.scope != 'save-dialog' && inputs.scope != 'packaged-save' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU transcription worker and bundled ONNX runtime
        run: cargo build --release --locked --manifest-path native/parakeet-worker/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-parakeet-x64
          path: |
            native/parakeet-worker/target/release/meeting-notes-parakeet-worker.exe
            native/parakeet-worker/target/release/*.dll

  composio-runtime:
    if: ${{ inputs.scope != 'save-dialog' && inputs.scope != 'packaged-save' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
          run_install: false
      - run: node scripts/build-windows-composio.js
      - name: Verify Windows protected credential store
        run: bun run scripts/test-windows-composio-keyring.ts
      - name: Verify Windows Composio startup
        shell: pwsh
        run: |
          $env:COMPOSIO_DISABLE_TELEMETRY = 'true'
          $env:DO_NOT_TRACK = '1'
          $version = & ./native/windows/bin/composio.exe --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '0.4.2') { throw "Composio startup failed: $version" }
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-composio-x64
          path: |
            native/windows/bin/composio.exe
            native/windows/bin/composio-LICENSE
            native/windows/bin/composio-source.txt

  windows-package:
    needs: [hotkey, transcription-worker, composio-runtime]
    # Independent acceptance uses verified build artifacts; source test failures stay red.
    if: ${{ !cancelled() && needs.hotkey.outputs.native-artifacts == 'success' && needs.transcription-worker.result == 'success' && needs.composio-runtime.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build:renderer
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-composio-x64
          path: native/windows/bin
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-parakeet-x64
          path: native/parakeet-worker/target/release
      - name: Build Windows installer and portable archive
        id: windows_package_build
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows resources
        run: node scripts/test-windows-package.js
      - name: Verify packaged app first-run startup
        run: node scripts/test-windows-app-startup.js
      - name: Verify packaged camera and microphone with generated devices
        run: node scripts/test-windows-packaged-devices.js
        env:
          EMBER_DEVICE_EVIDENCE: dist/windows-startup-evidence/devices
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ember-windows-startup-evidence
          path: dist/windows-startup-evidence/
          if-no-files-found: warn
      - name: Verify packaged app relaunch loads the saved profile
        run: node scripts/test-windows-app-relaunch.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ember-windows-relaunch-evidence
          path: dist/windows-relaunch-evidence/
          if-no-files-found: warn
      - name: Download predecessor Windows installer for replacement acceptance
        id: predecessor_installer
        if: ${{ !cancelled() && steps.windows_package_build.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ember-windows-installers-x64
          run-id: 37529977909
          github-token: ${{ github.token }}
          path: .windows-tools/previous-release
      - name: Verify Windows installer replacement and uninstaller
        if: ${{ !cancelled() && steps.predecessor_installer.conclusion == 'success' }}
        run: node scripts/test-windows-installer.js .windows-tools/previous-release
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ember-windows-installed-startup-evidence
          path: dist/windows-installed-startup-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-installers-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/latest.yml
          if-no-files-found: error

  windows-local-ai:
    needs: hotkey
    if: ${{ !cancelled() && needs.hotkey.outputs.native-artifacts == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin
      - uses: actions/cache@v4
        with:
          path: .windows-tools/ai-acceptance-model
          key: windows-gemma4-e2b-8e30dff3ac4c8434c49a7036fa15564bdbb6044e42bf04550bf1a096ad7e6a52
      - name: Verify real offline chat and streaming inference
        run: node scripts/test-windows-ai.js


  windows-whisper:
    needs: hotkey
    if: ${{ !cancelled() && needs.hotkey.outputs.native-artifacts == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin
      - uses: actions/cache@v4
        with:
          path: .windows-tools/whisper-acceptance
          key: windows-whisper-base-en-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002
      - name: Verify actual Windows Whisper transcription
        run: node scripts/test-windows-whisper.js

  windows-parakeet:
    if: ${{ inputs.scope != 'credentials' && inputs.scope != 'save-dialog' && inputs.scope != 'packaged-save' }}
    needs: transcription-worker
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-parakeet-x64
          path: native/parakeet-worker/target/release
      - uses: actions/cache@v4
        with:
          path: .windows-tools/parakeet-acceptance
          key: windows-parakeet-v3-8f23f0c03c8761650bdb5b40aaf3e40d2c15f1ce
      - name: Verify real Parakeet live-worker speech inference
        run: node scripts/test-windows-parakeet.js

  windows-phonon:
    if: ${{ inputs.scope != 'credentials' && inputs.scope != 'save-dialog' && inputs.scope != 'packaged-save' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install CPU runtime and verify real Phonon speech inference
        run: node scripts/test-windows-phonon.js
