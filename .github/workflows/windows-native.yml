name: Windows native helpers
on:
  workflow_dispatch:
  push:
    paths: ['native/windows/**', 'src/**', 'renderer/**', 'test/**', 'scripts/*windows*', 'package*.json', 'native/parakeet-worker/**', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['native/windows/**', 'src/**', 'renderer/**', 'test/**', 'scripts/*windows*', 'package*.json', 'native/parakeet-worker/**', '.github/workflows/windows-native.yml']
concurrency:
  group: windows-port-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hotkey:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run setup:windows-media
      - run: npm run setup:windows-ai
      - run: npm run setup:windows-whisper
      - name: Verify Windows local AI runtime launches
        run: ./native/windows/bin/llama/llama-server.exe --version
      - run: npm run build:renderer
        id: renderer
      - name: Verify offline Windows image text recognition
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-ocr.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify official Windows Notion CLI launches
        run: node scripts/test-windows-notion.js
      - name: Unit and media conversion tests
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Chromium recording lifecycle with generated devices
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          $env:EMBER_CAPTURE_RESULT = Join-Path $env:RUNNER_TEMP 'ember-capture-result.json'
          Remove-Item $env:EMBER_CAPTURE_RESULT -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-capture-renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_CAPTURE_RESULT | ConvertFrom-Json
          if ($result.rendererCapture -ne 'passed' -or $result.audioSamples -lt 16000) { throw 'Missing capture acceptance evidence' }
      - name: Chromium export compositor pixel checks
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:EMBER_EXPORT_RESULT = Join-Path $env:RUNNER_TEMP 'ember-export-result.json'
          Remove-Item $env:EMBER_EXPORT_RESULT -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-export-compositor.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_EXPORT_RESULT | ConvertFrom-Json
          if ($result.exportCompositor -ne 'passed' -or $result.pixelChecks -lt 13) { throw 'Missing compositor pixel evidence' }
      - name: Complete Chromium MP4 and GIF export lifecycle
        if: ${{ !cancelled() && steps.renderer.conclusion == 'success' }}
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Resolve-Path 'native/windows/bin/ffmpeg.exe').Path
          $env:FFPROBE_BIN = (Resolve-Path 'native/windows/bin/ffprobe.exe').Path
          $env:EMBER_EXPORT_MEDIA_RESULT = Join-Path $env:RUNNER_TEMP 'ember-export-media-result.json'
          Remove-Item $env:EMBER_EXPORT_MEDIA_RESULT -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-export.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content $env:EMBER_EXPORT_MEDIA_RESULT | ConvertFrom-Json
          if ($result.windowsExport -ne 'passed' -or $result.cancellation -ne 'passed' -or $result.frameComparison.frames -ne 18) { throw 'Missing export lifecycle evidence' }
      - uses: actions/setup-dotnet@v4
        if: ${{ !cancelled() }}
        with:
          dotnet-version: '10.0.x'
      - run: node scripts/build-windows-native.js x64
        id: native
        if: ${{ !cancelled() }}
      - name: Verify helper startup and request protocol
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        shell: pwsh
        run: |
          $info = [Diagnostics.ProcessStartInfo]::new()
          $info.FileName = (Resolve-Path 'native/windows/bin/meeting-notes-hotkey.exe').Path
          $info.UseShellExecute = $false
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $info.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($info)
          $output = $process.StandardOutput.ReadToEndAsync()
          $errors = $process.StandardError.ReadToEndAsync()
          $process.StandardInput.WriteLine('{"cmd":"status","id":42}')
          $process.StandardInput.WriteLine('{"cmd":"browserUrl","process":"ember-ci-not-a-browser","id":43}')
          $process.StandardInput.Close()
          if (!$process.WaitForExit(15000)) { $process.Kill(); throw 'Helper did not exit after stdin closed' }
          if ($process.ExitCode -ne 0) { throw $errors.Result }
          $messages = $output.Result -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json }
          $reply = $messages | Where-Object { $_.id -eq 42 }
          if (!$reply -or !$reply.tap) { throw 'Missing keyboard hook status reply' }
          $browser = $messages | Where-Object { $_.id -eq 43 }
          if (!$browser -or $null -ne $browser.url -or $browser.ok -eq $false) { throw 'Browser URL request must reject an unrecognized foreground app' }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.conclusion == 'success' }}
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin/
  transcription-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU transcription worker and bundled ONNX runtime
        run: cargo build --release --locked --manifest-path native/parakeet-worker/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-parakeet-x64
          path: |
            native/parakeet-worker/target/release/meeting-notes-parakeet-worker.exe
            native/parakeet-worker/target/release/*.dll

  composio-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
          run_install: false
      - run: node scripts/build-windows-composio.js
      - name: Verify Windows protected credential store
        run: bun run scripts/test-windows-composio-keyring.ts
      - name: Verify Windows Composio startup
        shell: pwsh
        run: |
          $env:COMPOSIO_DISABLE_TELEMETRY = 'true'
          $env:DO_NOT_TRACK = '1'
          $version = & ./native/windows/bin/composio.exe --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne '0.4.2') { throw "Composio startup failed: $version" }
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-composio-x64
          path: |
            native/windows/bin/composio.exe
            native/windows/bin/composio-LICENSE
            native/windows/bin/composio-source.txt

  windows-package:
    needs: [hotkey, transcription-worker, composio-runtime]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build:renderer
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-composio-x64
          path: native/windows/bin
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-parakeet-x64
          path: native/parakeet-worker/target/release
      - name: Build Windows installer and portable archive
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows resources
        run: node scripts/test-windows-package.js
      - name: Verify packaged app first-run startup
        run: node scripts/test-windows-app-startup.js
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ember-windows-startup-evidence
          path: dist/windows-startup-evidence/
          if-no-files-found: warn
      - name: Verify Windows installer and uninstaller
        run: node scripts/test-windows-installer.js
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows-installers-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/latest.yml
          if-no-files-found: error

  windows-local-ai:
    needs: hotkey
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin
      - uses: actions/cache@v4
        with:
          path: .windows-tools/ai-acceptance-model
          key: windows-gemma4-e2b-8e30dff3ac4c8434c49a7036fa15564bdbb6044e42bf04550bf1a096ad7e6a52
      - name: Verify real offline chat and streaming inference
        run: node scripts/test-windows-ai.js


  windows-whisper:
    needs: hotkey
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ember-windows-hotkey-x64
          path: native/windows/bin
      - uses: actions/cache@v4
        with:
          path: .windows-tools/whisper-acceptance
          key: windows-whisper-base-en-a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002
      - name: Verify actual Windows Whisper transcription
        run: node scripts/test-windows-whisper.js
