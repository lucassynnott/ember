name: Windows Drive
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/windows-port']
    paths: ['src/windows-drive-*.js', 'src/windows-cloud-files.js', 'src/main.js', 'src/preload.js', 'renderer/src/drive/**', 'renderer/src/types/bridge.d.ts', 'test/windows-drive-*.test.js', 'test/windows-cloud-files.test.js', 'scripts/test-windows-drive-*.js', 'scripts/test-windows-cloud-files.js', 'scripts/test-windows-explorer.ps1', 'scripts/windows-drive-explorer-acceptance.js', 'scripts/windows-drive-cloud-fixture.js', 'native/windows/Hotkey/**', '.github/workflows/windows-drive.yml']
  pull_request:
    paths: ['src/windows-drive-*.js', 'src/windows-cloud-files.js', 'src/main.js', 'src/preload.js', 'renderer/src/drive/**', 'renderer/src/types/bridge.d.ts', 'test/windows-drive-*.test.js', 'test/windows-cloud-files.test.js', 'scripts/test-windows-drive-*.js', 'scripts/test-windows-cloud-files.js', 'scripts/test-windows-explorer.ps1', 'scripts/windows-drive-explorer-acceptance.js', 'scripts/windows-drive-cloud-fixture.js', 'native/windows/Hotkey/**', '.github/workflows/windows-drive.yml']
concurrency:
  group: windows-drive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  drive:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci
      - name: Drive settings and search renderer
        run: npm run build:renderer
      - name: Drive coordinator and storage tests
        run: node --test "test/windows-drive-*.test.js" test/windows-cloud-files.test.js
      - name: Populated Windows recovery settings controls
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-drive-recovery-ui.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiResultPath = "dist/windows-drive-recovery-ui-evidence/result.json"
          if (!(Test-Path $uiResultPath)) { throw "Recovery UI acceptance exited without a complete result." }
          $uiResult = Get-Content $uiResultPath -Raw | ConvertFrom-Json
          foreach ($proof in @("originalRestorationRequiresConfirmation", "originalRestorationCancellationPreservesHold", "originalRestorationDisconnectRefused", "originalRestorationRetainsHold", "productionRenderer", "productionPreload", "realMouseControls", "confirmationVisibleAndFocused", "disconnectDisablesFinishing", "changedSourceDoesNotOfferFinishing", "savedCopiesWhileDisconnected", "historyRemovalRequiresConfirmation", "folderMoveRequiresConfirmation", "folderCancellationPreservesHold", "folderDisconnectDisablesFinishing", "deletionChecksReadOnly", "deletionRetryUsesFileExplorer", "deletionDisconnectDisablesActions", "deletionExplanationFullyVisible", "directoryDeletionChecksReadOnly", "directoryDeletionDistinctLabel", "directoryDeletionRetryExplained")) {
            if ($uiResult.$proof -ne $true) { throw "Missing recovery UI acceptance proof: $proof" }
          }
      - name: Build native Cloud Files helper
        if: ${{ !cancelled() }}
        id: native-build
        run: node scripts/build-windows-native.js x64
      - name: DPAPI configuration and interrupted journal persistence
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          npx --no-install electron scripts/test-windows-drive-state.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent Drive daemon, DPAPI authentication and reconnect
        run: node scripts/test-windows-drive-daemon.js
      - name: Provision media tools for recording backup acceptance
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/provision-windows-media.js
      - name: Configured Drive hydration and upload after app exit
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/test-windows-drive-daemon.js --configured
      - name: NTFS hydration, cache safety and upload locking
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        env:
          EMBER_VERIFY_EXPLORER_UI: '1'
        run: node scripts/test-windows-cloud-files.js
      - name: NTFS recoverable deletion and refusal
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/test-windows-drive-delete-native.js
      - name: NTFS folder acknowledgement loss across restart
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/test-windows-drive-folder-ack-native.js
      - name: NTFS empty directory deletion and restart recovery
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: node scripts/test-windows-drive-directory-delete-native.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-windows-drive-explorer-evidence
          path: |
            dist/windows-drive-explorer-evidence/
            dist/windows-drive-recovery-ui-evidence/

